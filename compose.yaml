services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
